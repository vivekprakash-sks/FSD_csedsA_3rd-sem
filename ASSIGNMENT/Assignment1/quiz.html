<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz 1</title>

    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }
        
        .quiz-container {
            width: 80%;
            max-width: 900px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .question {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        
        .question h2 {
            margin-top: 0;
            font-size: 22px;
        }
        
        label {
            display: block;
            margin: 15px 0;
            font-size: 18px;
            cursor: pointer;
        }
        
        input[type="radio"] {
            margin-right: 10px;
        }
        
        button {
            display: block;
            width: 100%;
            padding: 14px;
            font-size: 18px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #555;
        }
        
        #result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            background-color: #e8f5e9;
        }
        
        #result h2 {
            margin-top: 0;
        }
        
        .correct {
            color: green;
        }
        
        .wrong {
            color: red;
        }
    </style>

</head>

<body>

    <div class="quiz-container">

        <h1>Quiz 1</h1>

        <!-- Question 1 -->
        <div class="question">

            <h2>1. What does HTML stand for?</h2>

            <label>
                <input type="radio" name="q1" value="correct">
                Hyper Text Markup Language
            </label>

            <label>
                <input type="radio" name="q1" value="wrong">
                High Text Machine Language
            </label>

            <label>
                <input type="radio" name="q1" value="wrong">
                Hyper Tool Multi Language
            </label>

            <label>
                <input type="radio" name="q1" value="wrong">
                Home Text Markup Language
            </label>

        </div>


        <!-- Question 2 -->
        <div class="question">

            <h2>2. Which language is used to style a webpage?</h2>

            <label>
                <input type="radio" name="q2" value="wrong">
                HTML
            </label>

            <label>
                <input type="radio" name="q2" value="correct">
                CSS
            </label>

            <label>
                <input type="radio" name="q2" value="wrong">
                Python
            </label>

            <label>
                <input type="radio" name="q2" value="wrong">
                C++
            </label>

        </div>


        <!-- Question 3 -->
        <div class="question">

            <h2>3. Which language is used to make a webpage interactive?</h2>

            <label>
                <input type="radio" name="q3" value="wrong">
                HTML
            </label>

            <label>
                <input type="radio" name="q3" value="wrong">
                CSS
            </label>

            <label>
                <input type="radio" name="q3" value="correct">
                JavaScript
            </label>

            <label>
                <input type="radio" name="q3" value="wrong">
                Python
            </label>

        </div>


        <!-- Question 4 -->
        <div class="question">

            <h2>4. Which of the following is a programming language?</h2>

            <label>
                <input type="radio" name="q4" value="wrong">
                HTML
            </label>

            <label>
                <input type="radio" name="q4" value="wrong">
                CSS
            </label>

            <label>
                <input type="radio" name="q4" value="correct">
                Python
            </label>

            <label>
                <input type="radio" name="q4" value="wrong">
                HTTP
            </label>

        </div>


        <!-- Submit Button -->
        <button type="button" onclick="checkQuiz()">
            Submit Quiz
        </button>


        <!-- Result -->
        <div id="result">

            <h2>Quiz Result</h2>

            <p id="marks"></p>

            <p id="correctAnswers" class="correct"></p>

            <p id="wrongAnswers" class="wrong"></p>

            <p id="unattempted"></p>

        </div>

    </div>


    <script>
        function checkQuiz() {

            let score = 0;
            let correct = 0;
            let wrong = 0;
            let unattempted = 0;

            // Question 1
            let q1 = document.querySelector('input[name="q1"]:checked');

            if (q1 == null) {
                unattempted++;
            } else if (q1.value == "correct") {
                score++;
                correct++;
            } else {
                wrong++;
            }


            // Question 2
            let q2 = document.querySelector('input[name="q2"]:checked');

            if (q2 == null) {
                unattempted++;
            } else if (q2.value == "correct") {
                score++;
                correct++;
            } else {
                wrong++;
            }


            // Question 3
            let q3 = document.querySelector('input[name="q3"]:checked');

            if (q3 == null) {
                unattempted++;
            } else if (q3.value == "correct") {
                score++;
                correct++;
            } else {
                wrong++;
            }


            // Question 4
            let q4 = document.querySelector('input[name="q4"]:checked');

            if (q4 == null) {
                unattempted++;
            } else if (q4.value == "correct") {
                score++;
                correct++;
            } else {
                wrong++;
            }


            // Display Result
            document.getElementById("result").style.display = "block";

            document.getElementById("marks").innerHTML =
                "Your Score: <strong>" + score + " / 4</strong>";

            document.getElementById("correctAnswers").innerHTML =
                "Correct Answers: " + correct;

            document.getElementById("wrongAnswers").innerHTML =
                "Wrong Answers: " + wrong;

            document.getElementById("unattempted").innerHTML =
                "Unattempted Questions: " + unattempted;
        }
    </script>

</body>

</html>
