<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Event</title>
    <style>
        #box {
            height: 300px;
            width: 300px;
            background-color: skyblue;
            margin: 200px 0 0 100px;
            border: 2px solid red;
        }
    </style>
    <script>
        function eventcall() {
            alert('These are the mouse events');

        }

        function events1() {
            alert('These are the double click mouse event')
        }

        function events2() {
            alert('These are the right click mouse event')
        }

        function events3() {
            alert('These are the on mouse over  click mouse event')
        }

        function events4() {
            alert('These are the on mouse out click mouse event')
        }

        function events5() {
            alert('These are the on mouse up  click mouse event')
        }

        function events6() {
            alert('These are the on mouse down click mouse event')
        }
    </script>
</head>

<body>
    <div id="box" onclick="eventcall()">This is section A</div>
    <div id="box" ondblclick="events1()">This is section A</div>
