<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Information Management System</h1>

        <div class="form">

            <label>Student Name:</label>
            <input type="text" id="name" placeholder="Enter student name">

            <label>Roll Number:</label>
            <input type="text" id="roll" placeholder="Enter roll number">

            <h2>Subject Marks</h2>

            <label>English:</label>
            <input type="number" id="english" placeholder="Enter marks">

            <label>Mathematics:</label>
            <input type="number" id="math" placeholder="Enter marks">

            <label>Physics:</label>
            <input type="number" id="physics" placeholder="Enter marks">

            <label>Chemistry:</label>
            <input type="number" id="chemistry" placeholder="Enter marks">

            <label>Computer:</label>
            <input type="number" id="computer" placeholder="Enter marks">

            <button onclick="calculateResult()">Calculate Result</button>

        </div>

        <div id="output"></div>

    </div>
    <script src="studentInfoSystem.js"></script>

</body>

</html>
